<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>
        ✔️ Basic HTML and CSS quiz
    </h1>
    <form>
        <div class="quiz-items">
            <label for="Q1"> 1 What does the acronym stand for?
            </label>
            <input type=text id="Q1" placeholder="Write here">
        </div>
        <div class="quiz-items">
            <label for="Q2"> 2 How are id and class attributes selected in css?
            </label>
            <textarea id="Q2"> </textarea>
        </div>
        <div class="quiz-items">
            <label for="Q3"> 3 Which of the following is a valid CSS ?
            </label>
            <select id="Q3">
                <option value="" selected disabled>choose one</option>
                <option value="a">"""this is a comment"""</option>
                <option value="b">***this is a comment***</option>
                <option value="c">/* this is a comment /*</option>
            </select>
        </div>
        <div class="quiz-items">
            <label for="Q4"> 4 What is the bottom margin given this declaration?
            </label>
            <code>margin:10px 5px 15px </code>
            <input type=number id="Q4">
        </div>
        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
