<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Franco Valentino Bruñini Castillo">
    <meta name="description" content="Contact Rapids Company to book your trip or make inquiries.">
    <title>Rapids - Contact us Page</title>
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="Logo of the company">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>

    </header>
    <main>
        <h1 class="old">
            Rapids Company - Contact Us Page
        </h1>
        <h3>
            123 main river street <br>
            Canela, Brazil <br>
            +1 999 999 9999 <br>
            info@rapids.com

        </h3>
        <div class="layout">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3478.956569644!2d-50.85454092432995!3d-29.312949597742815!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x951ecd5b1eff3555%3A0x8f7d9481de645462!2sCaracol%20Park!5e0!3m2!1sen!2sar!4v1764541758041!5m2!1sen!2sar"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="quiz-items">
                    <label for="Q1">Name
                    </label>
                    <input type=text name=name id="Q1" placeholder="Type here">
                    <div class="quiz-items">
                        <label for="Q2">Email
                        </label>
                        <input type=email name=name id="Q2" placeholder="Type here">
                    </div>
                    <div class="radio-group">
                        <p class="option1">Message Purpose</p>
                        <label for="general">
                            <input type="radio" id="general" name="porpose" value="general">
                            General inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="porpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="Website">
                            <input type="radio" id="Website" name="porpose" value="Website">
                            Website Suggestion
                        </label>
                    </div>
                    <div class="quiz-items">
                        <label for="Q4"> Message
                        </label>
                        <textarea id="Q4" name=name placeholder="Type here"></textarea>
                    </div>

                </div>
                <div class="option">
                    <label for="subscribe" class="inline">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>
                <button type="submit">Get in touch! </button>

            </form>
        </div>
        <section class="employees">
            <h2>
                We are here to serve You
            </h2>
            <figure>
                <img src="images/Emilio.jpg" alt="Employee 1">
                <figcaption>
                    Emilio Rubio
                </figcaption>
            </figure>
            <figure>
                <img src="images/Francisco.jpg" alt="Employee 2">
                <figcaption>Francisco Caputo</figcaption>
            </figure>

            <figure>
                <img src="images/Carina.jpg" alt="Employee 3">
                <figcaption>Carina Brailovsky</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rapids | Created by Franco Valentino Bruñini Castillo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>

    </footer>
</body>

</html>
